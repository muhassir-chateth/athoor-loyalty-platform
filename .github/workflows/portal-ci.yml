# Continuous integration for the Loyalty_Service — the build that later gates fail
# (task 29.0, customer-experience-portal).
#
# WHY THIS EXISTS
#   Task 5 landed real structural guarantees: a branded `CustomerScope` that makes
#   an unscoped repository call a TYPE ERROR, a scoped repository layer, and a
#   log-field allowlist. Those guarantees are enforced by `tsc` and `vitest` — and,
#   until this workflow existed, ONLY when someone remembered to run them locally.
#   A guarantee that depends on human memory is a convention, not a guarantee.
#   This workflow converts them into a gate on `main`: the type error that proves
#   a query cannot escape its customer's scope now blocks a merge instead of
#   waiting to be noticed.
#
#   The repository's only other workflows, `backup.yml` and `keepalive.yml`, run on
#   `schedule` and `workflow_dispatch` alone. There was therefore no build attached
#   to a pull request at all, which is why every sub-task of 29 is unverifiable
#   until this one lands.
#
# THIS IS THE SUBSTRATE FOR 29.1–29.12
#   Sub-tasks 29.1 through 29.12 are each specified as build-failing, and each
#   EXTENDS THIS WORKFLOW with a further step. This file is the single place a
#   later gate is added:
#     29.1  axe-core accessibility gate         29.7  innerHTML / template-literal SQL
#     29.2  bespoke a11y assertions            29.8  scope-type gate (tsc)
#     29.3  forbidden-strings gate             29.9  client-storage gate
#     29.4  direct-origin gate                 29.10 dependency gate
#     29.5  referral literal gate              29.11 bundle budget gate
#     29.6  loyalty arithmetic gate            29.12 bundle smoke test
#   None of them introduces a parallel workflow. A second CI workflow would split
#   the required-checks list, let a gate go green while its sibling never ran, and
#   make "did CI pass?" a question with more than one answer.
#
# WHAT IT DOES NOT COVER YET
#   `npm run typecheck`, `npm run typecheck:portal`, `npm run build:portal:check`
#   and `npm test` — the verification that exists in `loyalty-service/package.json`.
#   There is deliberately no accessibility, forbidden-string, bundle-budget or
#   dependency gate here yet; each arrives with its own sub-task above, which is
#   also where its devDependency is pinned.
#
# WHAT TASK 7.1 ADDED, AND WHY IT BELONGED HERE RATHER THAN IN 29.x
#   Two steps, both closing a gap the task itself opened.
#
#   `typecheck:portal` — `loyalty-service/tsconfig.json` declares
#   `include: ["src/**/*.ts"]` and `rootDir: "src"`, so `theme-src/portal/**` was
#   outside every typecheck this workflow ran. Adding browser TypeScript without
#   adding its checker would have meant a `tsc --noEmit` that silently covered
#   none of it — the same shape of gap that let W1/W2 ship green. It runs against
#   `theme-src/tsconfig.json`, whose `lib` floor of ES2019 is what makes the
#   "no polyfills" promise of design §16.7 a compile error rather than a comment.
#
#   `build:portal:check` — the portal's theme assets are COMMITTED, because
#   design §25.5 approves a diff of specific files and then pushes those files, so
#   a build between approval and push would break the guarantee that the approved
#   bytes and the pushed bytes are the same object. That guarantee is only as good
#   as the artefacts being current. This step rebuilds and compares bytes, so a
#   source edit that was never rebuilt fails here instead of shipping stale bytes.
#   It is not the budget gate — that is 29.11, and it is not written yet.
#
#   A NOTE ON DETERMINISM. `build:portal:check` assumes esbuild produces identical
#   bytes for identical input, which is why design §16.7's exact version pin is
#   load-bearing beyond supply-chain hygiene. Verified deterministic across
#   repeated local runs on macOS; if this step ever fails on a Linux runner while
#   passing locally with no source change, cross-platform output divergence is the
#   first hypothesis to test, not a stale artefact.
#
# COST — REQUIREMENT 19.1, NEW RECURRING COST = £0/MONTH
#   This repository is PUBLIC, and GitHub Actions is free and unmetered on public
#   repositories: standard GitHub-hosted runners for public repos consume no
#   included-minutes allowance and generate no billable usage, however often this
#   runs. So the zero-cost constraint holds by the repository's visibility, not by
#   restraint in the schedule — recorded here so a future reader does not have to
#   re-derive it, and so the ONE change that would break it is written down:
#   making this repository private would put every run on the metered allowance.
#
# SECURITY — LEAST PRIVILEGE
#   `permissions: contents: read` and NO secret. Typechecking and unit tests read
#   source and run in-process; they need no token beyond the read required to
#   check the code out, and they must never be handed one. `backup.yml` and
#   `keepalive.yml` set `permissions: {}` while handling PII — the same
#   least-privilege convention, one rung up because this job actually reads the
#   repository. A workflow with no write scope cannot push, comment, tag or
#   release, so a compromised dependency in the test tree cannot alter `main`.
#
# FAILURE PHILOSOPHY
#   `typecheck` and `test` are SEPARATE steps, so a red run names which gate broke
#   rather than presenting one opaque failure to bisect. Neither step is allowed
#   `continue-on-error`, and neither is conditional: a gate that cannot fail the
#   build is not a gate, it is a report nobody reads.
name: Portal CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read the repository; hold nothing else. No secret is consumed by this workflow.
permissions:
  contents: read

concurrency:
  # One in-flight run per ref. A rapid push sequence to a branch supersedes its
  # own earlier runs rather than queueing them, so the answer you read is always
  # the answer for the newest commit.
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        # Every `run` step below executes from the backend package, which owns its
        # own `package.json`, `tsconfig.json` and `package-lock.json`.
        working-directory: loyalty-service

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # ---------------------------------------------------------------------
          # FULL HISTORY, for the dependency gate of 29.10 and nothing else.
          #
          # `actions/checkout` defaults to `fetch-depth: 1` — the tip commit only.
          # 29.10 asks that the production dependency set be byte-identical "before
          # and after the portal", and the only trustworthy record of "before" is the
          # commit that precedes the portal's first dependency change (`32eaca0`, the
          # parent of `8fe248a`). The gate reads that commit's `package.json` and
          # `package-lock.json` with `git show` and compares them package by package.
          #
          # The alternative was to transcribe the pre-portal manifest into the test as
          # a constant. Rejected: an allowlist can be edited to make a red gate green,
          # and an allowlist edited for that reason proves nothing. A commit already in
          # the history cannot be edited, which is what makes the comparison worth
          # running at all.
          #
          # In a shallow clone the gate FAILS with an explanatory message rather than
          # skipping — a build-failing gate that silently passes when it cannot run is
          # not build-failing. So this line is load-bearing: remove it and `npm test`
          # goes red on `portalDependencyGate.test.ts`, by design.
          # ---------------------------------------------------------------------
          fetch-depth: 0

      # ---------------------------------------------------------------------
      # Node is pinned to the EXACT version the project runs, not a floating
      # major. `24.x` would silently move under us on a GitHub image update and
      # turn an upstream Node change into a mystery CI failure on an unrelated
      # pull request. Bumping this line is then a deliberate, reviewed change.
      #
      # The npm cache is keyed on `loyalty-service/package-lock.json`, so the
      # cache is invalidated by exactly the file that determines what `npm ci`
      # installs — and by nothing else.
      # ---------------------------------------------------------------------
      - name: Set up Node 24.17.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: npm
          cache-dependency-path: loyalty-service/package-lock.json

      # ---------------------------------------------------------------------
      # `npm ci`, never `npm install`. `npm ci` installs the lockfile exactly and
      # fails if `package.json` and the lockfile disagree, so what CI verifies is
      # what the lockfile pins. `npm install` is free to resolve a newer
      # satisfying version, which would make CI green against a dependency tree
      # nobody has committed — and would quietly defeat the dependency gate of
      # 29.10 before it is even written.
      # ---------------------------------------------------------------------
      - name: Install dependencies from the lockfile
        run: npm ci

      # ---------------------------------------------------------------------
      # GATE 1 — types. This is what makes Task 5's `CustomerScope` load-bearing:
      # a repository call that has not proved which customer it is scoped to does
      # not compile. `--noEmit` because CI is asking a question, not producing a
      # build artefact.
      # ---------------------------------------------------------------------
      - name: Typecheck the service (tsc --noEmit)
        run: npm run typecheck

      # ---------------------------------------------------------------------
      # GATE 2 — types, browser side. A separate step from GATE 1 because it is a
      # separate program with a different `lib` floor and no `@types/node`: the
      # service targets Node 24 at ES2023, the portal targets a browser at ES2019.
      # One combined step would report a single failure for two different runtimes.
      # ---------------------------------------------------------------------
      - name: Typecheck the portal source (tsc --noEmit)
        run: npm run typecheck:portal

      # ---------------------------------------------------------------------
      # GATE 3 — the committed theme assets match the committed source. See the
      # header note for why the artefacts are committed and what this protects.
      # Runs before the tests because the bundle smoke test reads these same files
      # from disk: if they are stale, this step names the cause precisely, where
      # the smoke test would report a puzzling assertion failure instead.
      # ---------------------------------------------------------------------
      - name: Portal artefacts are current (esbuild rebuild and byte compare)
        run: npm run build:portal:check

      # ---------------------------------------------------------------------
      # GATE 4 — behaviour. `vitest run` is single-shot, so it exits rather than
      # watching and hanging the runner until the job timeout.
      # ---------------------------------------------------------------------
      - name: Test (vitest run)
        run: npm test
